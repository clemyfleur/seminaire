<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morpion · À deux</title>
<style>
:root{color-scheme:light;--ink:#233831;--muted:#6a7972;--paper:#f6f5ef;--green:#326650;--orange:#bd663e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:430px;text-align:center}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.23em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h1{font-size:clamp(42px,10vw,58px);font-weight:650;letter-spacing:-.055em;line-height:1.05;margin:0 0 12px}
.subtitle{font-size:14px;color:var(--muted);margin:0 0 30px}
.players{display:flex;gap:10px;margin-bottom:20px}
.player{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border:1px solid #dce1d8;border-radius:12px;font-size:13px;color:var(--muted);transition:background .15s,border-color .15s}
.player strong{font-size:22px;line-height:1;color:var(--green)}
.player.o strong{color:var(--orange)}
.player.active{background:#e5eee3;border-color:#83a28a;color:var(--ink)}
.player.o.active{background:#f6e9de;border-color:#c99579}
#status{margin:0 0 18px;font-size:17px;font-weight:600;min-height:26px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;background:#e6e8df;border:1px solid #d8ded2;border-radius:22px;box-shadow:0 14px 35px #243b2c08}
.cell{aspect-ratio:1;display:grid;place-items:center;padding:0;border:1px solid #e0e3da;border-radius:12px;background:#fffef9;color:var(--green);font:600 clamp(42px,14vw,72px)/1 system-ui,sans-serif;cursor:pointer;transition:background .15s,transform .15s}
.cell:hover:not(:disabled){background:#eff4e9;transform:translateY(-2px)}
.cell:focus-visible,#restart:focus-visible{outline:3px solid #bd663e;outline-offset:4px}
.cell.o{color:var(--orange)}
.cell:disabled{cursor:default;opacity:1}
.cell.winner{background:#d6e8cf;border-color:#91b289}
#restart{width:100%;margin-top:24px;padding:15px 20px;border:0;border-radius:12px;background:var(--ink);color:white;font:600 14px system-ui,sans-serif;cursor:pointer;transition:background .15s}
#restart:hover{background:#3a5549}
.hint{margin:20px 0 0;font-size:12px;line-height:1.7;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main aria-labelledby="title">
<p class="eyebrow">Deux joueurs · Un écran</p>
<h1 id="title">Morpion</h1>
<p class="subtitle">Un classique, un adversaire, à vous de jouer.</p>
<div class="players" aria-label="Les joueurs">
<div class="player active" id="player-x"><strong>X</strong><span>Joueur X</span></div>
<div class="player o" id="player-o"><strong>O</strong><span>Joueur O</span></div>
</div>
<p id="status" role="status" aria-live="polite" aria-atomic="true">Au tour de X</p>
<div class="board" role="group" aria-label="Grille de morpion, 3 lignes et 3 colonnes">
<button class="cell" type="button" aria-label="Ligne 1, colonne 1 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 1, colonne 2 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 1, colonne 3 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 2, colonne 1 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 2, colonne 2 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 2, colonne 3 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 3, colonne 1 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 3, colonne 2 : vide"></button>
<button class="cell" type="button" aria-label="Ligne 3, colonne 3 : vide"></button>
</div>
<button id="restart" type="button">Nouvelle partie</button>
<p class="hint">Alignez trois symboles pour gagner.<br>Une ligne, une colonne ou une diagonale.</p>
<noscript><p>Activez JavaScript dans votre navigateur pour jouer.</p></noscript>
</main>
<script>
'use strict';
const cells = Array.from(document.querySelectorAll('.cell'));
const status = document.getElementById('status');
const playerX = document.getElementById('player-x');
const playerO = document.getElementById('player-o');
const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board = Array(9).fill('');
let current = 'X';
let finished = false;
function render(winning = []) {
  cells.forEach((cell, i) => {
    cell.textContent = board[i];
    cell.classList.toggle('o', board[i] === 'O');
    cell.classList.toggle('winner', winning.includes(i));
    cell.disabled = finished || board[i] !== '';
    cell.setAttribute('aria-label', 'Ligne ' + (Math.floor(i / 3) + 1) + ', colonne ' + (i % 3 + 1) + ' : ' + (board[i] || 'vide'));
  });
  playerX.classList.toggle('active', !finished && current === 'X');
  playerO.classList.toggle('active', !finished && current === 'O');
}
function play(i) {
  // Un coup refusé ne modifie aucun état, y compris le joueur courant.
  if (!Number.isInteger(i) || i < 0 || i >= board.length) return;
  if (finished || board[i] !== '') return;
  board[i] = current;
  const winning = lines.find(line => line.every(index => board[index] === current));
  if (winning) {
    finished = true;
    status.textContent = current + ' a gagné !';
  } else if (board.every(Boolean)) {
    finished = true;
    status.textContent = 'Match nul !';
  } else {
    // Le tour dépend uniquement des coups effectivement posés sur la grille.
    current = board.filter(Boolean).length % 2 === 0 ? 'X' : 'O';
    status.textContent = 'Au tour de ' + current;
  }
  render(winning || []);
}
cells.forEach((cell, i) => cell.addEventListener('click', () => {
  if (finished || board[i] !== '') return;
  play(i);
}));
document.getElementById('restart').addEventListener('click', () => {
  board = Array(9).fill('');
  current = 'X';
  finished = false;
  status.textContent = 'Au tour de X';
  render();
});
render();
</script>
</body>
</html>
